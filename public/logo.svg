<svg width="200" height="48" viewBox="0 0 200 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Chat Bubble Icon with AI Sparkles -->
  <g id="icon">
    <!-- Main Chat Bubble -->
    <rect x="4" y="8" width="32" height="28" rx="8" fill="#3B82F6"/>
    <path d="M12 36L16 32H12V36Z" fill="#3B82F6"/>
    
    <!-- AI Sparkle 1 -->
    <circle cx="12" cy="18" r="1.5" fill="white"/>
    <line x1="12" y1="14" x2="12" y2="16.5" stroke="white" stroke-width="1" stroke-linecap="round"/>
    <line x1="12" y1="19.5" x2="12" y2="22" stroke="white" stroke-width="1" stroke-linecap="round"/>
    <line x1="8" y1="18" x2="10.5" y2="18" stroke="white" stroke-width="1" stroke-linecap="round"/>
    <line x1="13.5" y1="18" x2="16" y2="18" stroke="white" stroke-width="1" stroke-linecap="round"/>
    
    <!-- AI Sparkle 2 -->
    <circle cx="28" cy="22" r="1.5" fill="white"/>
    <line x1="28" y1="18" x2="28" y2="20.5" stroke="white" stroke-width="1" stroke-linecap="round"/>
    <line x1="28" y1="23.5" x2="28" y2="26" stroke="white" stroke-width="1" stroke-linecap="round"/>
    <line x1="24" y1="22" x2="26.5" y2="22" stroke="white" stroke-width="1" stroke-linecap="round"/>
    <line x1="29.5" y1="22" x2="32" y2="22" stroke="white" stroke-width="1" stroke-linecap="round"/>
    
    <!-- Chat Lines -->
    <rect x="10" y="16" width="12" height="2" rx="1" fill="white" opacity="0.6"/>
    <rect x="10" y="22" width="8" height="2" rx="1" fill="white" opacity="0.6"/>
  </g>
  
  <!-- Brand Text -->
  <text x="48" y="31" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0A0A0A">
    ChatBot
  </text>
  <text x="128" y="31" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#6B7280">
    AI
  </text>
</svg>
